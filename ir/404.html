<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صفحه پیدا نشد | آی‌بروکر</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060A17">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:"Vazirmatn";src:url(/assets/vazirmatn.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Archivo";src:url(/assets/archivo.woff2) format("woff2");font-weight:100 900;font-display:swap}
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#060A17;color:#E6EAF5;font:400 17px/1.8 "Vazirmatn","Archivo",system-ui,sans-serif}
body{display:flex;flex-direction:column;min-height:100vh}
a{color:#F2D493}
a:focus-visible{outline:2px solid #6FD3E8;outline-offset:3px}
.top,.foot{padding:20px 24px}
.top{border-bottom:1px solid rgba(160,180,230,.16)}
.mark{color:#E6EAF5;text-decoration:none;font-weight:700;font-size:20px;font-family:"Archivo",system-ui,sans-serif}
.mark span{color:#E3B65C}
main{flex:1;display:flex;align-items:center;padding:48px 24px}
.box{max-width:620px;margin:0 auto}
.code{color:#E3B65C;font-size:15px;margin:0 0 12px}
h1{font-size:clamp(28px,6vw,42px);line-height:1.3;margin:0 0 16px;font-weight:700}
p{color:#9AA6C2;margin:0 0 24px}
ul{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 20px;border:1px solid rgba(160,180,230,.3);border-radius:6px;text-decoration:none;color:#E6EAF5}
.btn.main{background:#E3B65C;border-color:#E3B65C;color:#060A17;font-weight:600}
.foot{border-top:1px solid rgba(160,180,230,.16);color:#9AA6C2;font-size:14px}
</style>
</head>
<body>
<header class="top"><a class="mark" href="/" lang="en" dir="ltr">i<span>B</span>rooker</a></header>
<main>
  <div class="box">
    <p class="code">خطای ۴۰۴</p>
    <h1>این صفحه وجود ندارد.</h1>
    <p>ممکن است پیوند قدیمی باشد یا نشانی اشتباه وارد شده باشد. آی‌بروکر میز صادرات و کارگزاری تجاری برای تولیدکنندگان فولاد، فلزات، مواد معدنی و تجهیزات صنعتی است.</p>
    <ul>
      <li><a class="btn main" href="/">رفتن به صفحهٔ اصلی</a></li>
      <li><a class="btn" href="/#contact">تماس با ما</a></li>
      <li><a class="btn" href="https://ibrooker.com/" hreflang="en" lang="en" dir="ltr">English</a></li>
    </ul>
  </div>
</main>
<footer class="foot"><a href="mailto:export@ibrooker.com" dir="ltr">export@ibrooker.com</a></footer>
</body>
</html>
